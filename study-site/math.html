    <div class="card">
        <h2>核心公式表（随时查阅）</h2>
        <ul>
            <li><b>导数定义：</b>f'(x) = lim(Δx→0) [f(x+Δx)-f(x)]/Δx</li>
            <li><b>加法法则：</b>(u+v)' = u' + v'</li>
            <li><b>乘法法则：</b>(uv)' = u'v + uv'</li>
            <li><b>链式法则：</b>y = f(g(x)), y' = f'(g(x)) * g'(x)</li>
            <li><b>基本公式：</b>(x^n)' = n*x^(n-1)</li>
        </ul>
    </div>
